# Central CodeRabbit config: applies to any chodeus repository without its own .coderabbit.yaml.
# Serves the forks whose review branches can't carry a config file (Lidarr, unraid-appdata.backup); each fork's rules are scoped to its own paths.
language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  pre_merge_checks:
    docstrings:
      mode: "off"
  auto_review:
    enabled: true
    drafts: false
    # Fork review PRs target develop (Lidarr) or testing (unraid-appdata.backup); the default branch is always included.
    base_branches:
      - "^develop$"
      - "^testing$"

  path_filters:
    - "!**/bin/**"
    - "!**/obj/**"
    - "!_output/**"
    - "!_tests/**"
    - "!_artifacts/**"
    - "!**/*.dll"
    - "!**/*.pdb"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.svg"
    - "!**/*.ico"
    - "!**/yarn.lock"
    - "!**/package-lock.json"
    - "!**/*.tgz"
    - "!**/*.txz"

  path_instructions:
    - path: "**"
      instructions: |
        Review logic, correctness, data safety and security. Do not report formatting, import order or
        naming that linters already enforce (StyleCop on Lidarr), and do not ask for cleanup of existing
        code the change does not touch.
        - Fix the root cause. A null guard or try/catch that hides bad input is a finding, not a fix.
        - Comments explain a non-obvious why in one or two lines. Flag comments that narrate what the code
          does, change history, or read as generated prose.
        - A comment, docstring, help text, log message or UI label that disagrees with what the code does is
          a correctness finding, not a stale-comment nit: report it and say which side is wrong.
        - One concern per change: flag unrelated edits, IDE or tool files, and CI changes that only suit a fork.
        - Never cache or persist a transient failure (timeout, 5xx, rate limit) as a real empty or negative result.
        - Never put a token, API key or password in a URL, query string, log line or exception message.
        - 0 and "" can be real values; do not treat them as missing.

    - path: "src/**/*.cs"
      instructions: |
        Lidarr (.NET 8, block-scoped namespaces). Do not suggest Sonarr v5 / .NET 10 idioms: file-scoped
        namespaces, TypedResults, or collection-expression rewrites of existing code.
        PUBLIC SURFACE: plugins are compiled against upstream develop and run on this build. Flag any change to
        an existing public or protected constructor, method signature, interface member or public type that
        exists in develop. New behaviour must come through new members, new types or an added constructor
        overload that keeps develop's constructor intact.
        - Do not store values on entity or *Files rows that can go stale (for example a download client or
          indexer id that dies when the provider is deleted and re-added). Persist per event in history.
        - Database and remote cost: partial updates use SetFields, not a full-row update; batch rather than
          write per item; do not load a whole library into memory; do not multiply metadata-server calls.
        - Decision-engine and import specifications log their rejection reasons at Debug, like the existing ones;
          use Warn only for a failure that stops an item and needs the user. Do not suggest wrapping Trace/Debug
          calls in log-level checks.
        - Parse numbers and dates culture-invariantly. Prefer early returns over nested conditionals and
          nested ternaries. No `dynamic`. Enums are PascalCase. Do not suggest adding `sealed`.
        - Delete dead code rather than commenting it out.
        - Do not suggest translating log messages.

    - path: "src/NzbDrone.Core/Datastore/Migration/**"
      instructions: |
        - File NNN_snake_case.cs, class name matching the file, [Migration(NNN)], deriving NzbDroneMigrationBase.
        - Never edit a migration that has shipped; changes go in a new one. One migration per feature.
        - NUMBERING in this fork: a change meant for upstream takes the next sequential number after
          upstream's latest; a change that only exists in this build uses 900 or higher so it can never
          collide with upstream. FluentMigrator refuses to start on duplicate numbers, so flag any number
          already used by upstream or by another branch in this build.
        - When a feature moves or reshapes existing settings or data (for example Config table keys into a new
          table), the migration must carry the existing values over.
        - Quote identifiers in Execute.Sql so the SQL also runs on Postgres.

    - path: "src/Lidarr.Api.V1/**"
      instructions: |
        - Keep logic out of resources, and never return Core models directly.
        - Existing response fields stay backward-compatible: do not rename, retype or drop them.
        - openapi.json is regenerated by a bot; flag hand edits to it.

    - path: "frontend/src/**"
      instructions: |
        - Every user-facing string goes through translate() with an en.json key; flag hardcoded text.
        - New pages and components are TypeScript. Reuse and compose existing components and CSS modules
          rather than new near-duplicates or class names built from strings.
        - Backend setting or resource changes need the matching UI change.

    - path: "src/NzbDrone.Core/Localization/Core/*.json"
      instructions: |
        Only en.json is edited by hand; other languages arrive through Weblate, so flag any hand edit to a
        file other than en.json. In en.json:
        - Keys stay in ordinal (case-sensitive) alphabetical order; flag any out-of-order insertion.
        - Use {appName} and named {variables}; never assemble sentences from fragments.
        - Flag keys the change adds but never uses, and keys it orphans.

    - path: "src/**/*Test*/**"
      instructions: |
        NUnit with FluentAssertions. Test methods are lower_snake_case and folders match namespaces.
        Test data uses obvious placeholders ("Artist Name", "Album Title"), never real artist names, paths,
        hosts or credentials. The change's behaviour must be covered, and each new test must be able to fail.

    - path: "src/{include,scripts}/*.php"
      instructions: |
        unraid-appdata.backup engine. emhttp plugin PHP: no Composer or autoloader, raw includes, and Unraid
        runtime globals (DockerClient, DockerTemplates, _var, $var) come from the webGui, so do not flag them
        as undefined. backup.php runs as root from cron: it stops containers, tars their volumes, verifies,
        restarts them and deletes old backup sets.
        - Supported range is Unraid 6.12 (PHP 8.2) to 7.4 (PHP 8.4). Flag PHP 8.3+ syntax or functions
          (typed class constants, json_validate, array_find, property hooks, `new` chained without
          parentheses). Unraid internals differ by release, so a change that relies on newer webGui behaviour
          needs a fallback for the older one. Precedent: 7.4's flash_backup streams the zip to stdout, while
          6.12-7.3 write a file and print its name.
        - Fail closed: never tar a container whose stop was not confirmed by a fresh state read, and never
          downgrade a failure that should fail the run to INFO or WARN. Precedent: ignoreBackupErrors=yes
          logged tar failures at INFO, the run reported success, and retention rotated the good sets out.
        - Retention deletes ab_* sets with rm -rf: it must not run after a failed run, must stay confined to
          the destination's ab_* entries, and must never delete the newest good set.
        - Excludes: split stored lists on CRLF, LF and CR (precedent: explode("\r\n") silently dropped LF-only
          excludes and archives grew by 100+ GB). An exclude must apply to the path tar actually reads,
          including any mapped or snapshot path.
        - External commands: escapeshellarg every interpolated value; long-running commands keep
          ABSettings::$externalCmdPidCapture so Abort can kill them; never capture large output in memory
          (exec() into $output with a multi-GB stdout exhausts PHP's 256M limit).
        - Containers: after the run, start only the containers the run stopped, in autostart order with their
          delays. "No such container" (Docker 404) is not retried.
        - Never put an API key or token in config.json (it is copied into every backup set, readable by the
          users group over SMB), a log line, the debug log (users post it publicly) or a command line.

    - path: "src/include/http.php"
      instructions: |
        unraid-appdata.backup AJAX action endpoint. Unraid's local_prepend.php checks csrf_token on POST only,
        and the webGui's global $.ajaxPrefilter adds it to every same-origin jQuery POST (6.12-7.4). So actions
        that change state (manualBackup, abort, startRestore, copyConfigFromProd) must be POST-only and read
        $_POST; flag any state change reachable by GET or through $_REQUEST, but do not ask the endpoint to
        re-verify the token. Read-only actions may stay GET. startRestore starts a root restore that extracts
        archives to a user-chosen destination: flag any unvalidated path that reaches tar or the filesystem.

    - path: "src/{pages/content/*.php,**/*.page}"
      instructions: |
        unraid-appdata.backup pages: PHP, HTML and inline jQuery inside the Unraid page layout.
        - A bare same-origin $.post or $.ajax({type: 'POST'}) is correct, because Unraid's global ajaxPrefilter
          adds csrf_token on 6.12-7.4; do not flag it. Flag a state-changing call made with GET, and a fetch or
          XHR to a plugin PHP endpoint that does not send csrf_token as a POST field (the X-CSRF-Token header is
          only accepted from Unraid 7.3.0).
        - The settings form posts the whole config: a new setting must round-trip through the form with a
          default, so saving the page never drops or reverts it; config keys must load with defaults in both
          older and newer builds.
        - Escape container names, paths and log text before inserting them into the DOM.
        - 0 and "" are real values; do not use || or bare truthiness where they are legitimate.

    - path: "appdata.backup*.plg"
      instructions: |
        unraid-appdata.backup manifest. The <FILE Run> install and Method="remove" scripts run as root.
        - The remove method deletes /boot/config/plugins/appdata.backup, the user's config: never widen any
          rm, and never delete outside the plugin's two fixed directories.
        - Versions must keep increasing by strcmp, because Unraid's plugin install refuses an older version.
          pluginURL must name the branch the manifest ships from, and the sha256 must match the release asset.
        - min="6.12" stays unless the code really needs a newer Unraid; raising it needs a matching
          pre-install check.
        - Fix branches meant for upstream must not touch the manifests (the maintainer cuts releases); only
          the testing branch's packaging commit edits them.

  tools:
    gitleaks:
      enabled: true
    # off: emhttp PHP has no stubs, so phpstan/phpmd/phpcs flag Unraid's runtime globals as undefined and bury real findings
    phpstan:
      enabled: false
    phpmd:
      enabled: false
    phpcs:
      enabled: false
    # off: style-only noise on README files
    markdownlint:
      enabled: false
